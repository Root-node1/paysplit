spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/paysplit
spring.datasource.username=paysplit_user
spring.datasource.password=paysplit_dev
spring.datasource.driver-class-name=org.postgresql.Driver

payaza.merchant-key=${PAYAZA_MERCHANT_KEY}
payaza.secret-key=${PAYAZA_SECRET_KEY}
payaza.connection-mode=Test
payaza.base-url=https://api.payaza.africa/live
webhook-skip-signature=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
